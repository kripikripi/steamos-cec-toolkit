# SteamOS CEC Toolkit: Steam GamepadUI HDMI-CEC remote keymap
# Steam GamepadUI KEYBOARD_SIMULATOR bindings:
#   KEY_ENTER = A (OK)            KEY_ESC = B (Cancel/Back)
#   KEY_F1 = STEAM Menu           KEY_F2 = Quick Access Menu (...)
#   KEY_F3 = X (Secondary)        KEY_F4 = Y (Options)
#   KEY_F6 = L1 (Left Bumper)     KEY_F7 = R1 (Right Bumper)
#   KEY_F8 = View (Select)        KEY_F9 = Options (Start)
[[protocols]]
name = "cec"
protocol = "cec"
[protocols.scancodes]
0x00 = "KEY_ENTER"
0x01 = "KEY_UP"
0x02 = "KEY_DOWN"
0x03 = "KEY_LEFT"
